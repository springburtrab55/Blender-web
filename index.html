<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Web Studio - Estable</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js y Controladores necesarios (Orbit y Transform) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <!-- Cargador GLTF/GLB -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="viewport-container">
        <div id="info-overlay">Visor 3D | Clic en un objeto para seleccionarlo</div>
        
        <!-- Panel de Herramientas -->
        <div id="toolbar">
            <h3>Objetos</h3>
            <button id="btn-cube">Crear Cubo</button>
            
            <hr style="border-color: #444; margin: 6px 0;">
            <h3>Importar (.GLB)</h3>
            <input type="file" id="file-uploader" accept=".glb, .gltf" style="display: none;">
            <button id="btn-upload" style="background-color: #2b5b84; color: white;">Cargar Modelo GLB</button>

            <hr style="border-color: #444; margin: 6px 0;">
            <h3>Transformar (Gizmo)</h3>
            <div style="display: flex; gap: 4px;">
                <button id="mode-translate" class="active-btn">Mover</button>
                <button id="mode-rotate">Rotar</button>
                <button id="mode-scale">Escalar</button>
            </div>

            <hr style="border-color: #444; margin: 6px 0;">
            <h3>Color</h3>
            <input type="color" id="color-picker" value="#db7100">

            <hr style="border-color: #444; margin: 6px 0;">
            <button id="btn-delete" style="background-color: #a83232; color: white;">Borrar Seleccionado</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
