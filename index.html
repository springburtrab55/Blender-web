<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Web Studio - v2.0</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Librerías de Three.js y Controladores Profesionales (Orbit y Transform) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <!-- Cargadores 3D Universales (GLTF, OBJ) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

    <div id="viewport-container">
        <!-- Indicador de Estado y Versión -->
        <div id="info-overlay">Blender Web Studio v2.0 | Estable & Fluido (60 FPS)</div>
        
        <!-- Barra Lateral de Herramientas y Módulos -->
        <div id="toolbar">
            <div class="section-title">📦 Geometrías Base</div>
            <div class="button-group">
                <button id="btn-cube">Cubo</button>
                <button id="btn-sphere">Esfera</button>
                <button id="btn-cylinder">Cilindro</button>
            </div>

            <hr class="divider">

            <div class="section-title">📂 Importar Modelo (GLB/OBJ)</div>
            <div class="button-group">
                <input type="file" id="file-uploader" accept=".glb, .gltf, .obj" style="display: none;">
                <button id="btn-upload" style="background-color: #2b5b84;">Cargar Archivo...</button>
            </div>

            <hr class="divider">

            <div class="section-title">🔄 Herramientas de Transformación</div>
            <div class="button-group">
                <button id="mode-translate" class="active-mode">Mover (G)</button>
                <button id="mode-rotate">Rotar (R)</button>
                <button id="mode-scale">Escalar (S)</button>
            </div>

            <hr class="divider">

            <div class="section-title">🎨 Material y Color</div>
            <div class="color-row">
                <label>Color Base:</label>
                <input type="color" id="color-picker" value="#db7100">
            </div>

            <hr class="divider">

            <div class="section-title">💡 Iluminación y Cámara</div>
            <div class="button-group">
                <button id="btn-add-light">Agregar Luz Puntual</button>
                <button id="btn-switch-camera">Cambiar Cámara (Activa)</button>
            </div>

            <hr class="divider">

            <button id="btn-delete" class="danger-btn">Eliminar Objeto Seleccionado</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
