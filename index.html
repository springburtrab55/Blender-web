<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Web Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="viewport-container">
        <div id="info-overlay">Blender Web | Modo Edición</div>
        
        <!-- Barra de Herramientas Flotante -->
        <div id="toolbar">
            <h3>Crear</h3>
            <button id="btn-cube">Cubo</button>
            <button id="btn-sphere">Esfera</button>
            <button id="btn-cylinder">Cilindro</button>
            <hr style="border-color: #444; margin: 8px 0;">
            <h3>Color</h3>
            <input type="color" id="color-picker" value="#db7100">
            <hr style="border-color: #444; margin: 8px 0;">
            <button id="btn-delete" style="background-color: #a83232; color: white;">Borrar Objeto</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
