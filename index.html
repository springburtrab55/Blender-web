<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Web Studio - v3.0</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js y dependencias de control y cargadores -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div id="viewport-container">
        <div id="info-overlay">Blender Web v3.0 | Estándar Profesional</div>
        
        <!-- Panel Lateral Estilo Blender -->
        <div id="toolbar">
            <div class="section-title">📦 Geometrías</div>
            <div class="button-group">
                <button id="btn-cube">Cubo</button>
                <button id="btn-sphere">Esfera</button>
                <button id="btn-cylinder">Cilindro</button>
            </div>

            <div class="section-title">📂 Importar (Modelos / ZIP Workshop)</div>
            <div class="button-group">
                <input type="file" id="file-uploader" accept=".glb, .gltf, .obj, .fbx, .zip" style="display: none;">
                <button id="btn-upload" style="background-color: #2b5b84;">Cargar Archivo...</button>
            </div>

            <div class="section-title">🔍 Jerarquía y Contenido</div>
            <div class="button-group">
                <button id="btn-inspect-hierarchy">Ver Estructura / Piezas</button>
            </div>

            <div class="section-title">🔄 Transformación (Gizmo)</div>
            <div class="button-group">
                <button id="mode-translate" class="active-mode">Mover</button>
                <button id="mode-rotate">Rotar</button>
                <button id="mode-scale">Escalar</button>
            </div>

            <div class="section-title">🎨 Texturas y Materiales</div>
            <div class="control-row">
                <span>Color Base</span>
                <input type="color" id="color-picker" value="#db7100">
            </div>
            <div class="button-group" style="margin-top: 6px;">
                <input type="file" id="texture-uploader" accept="image/*" style="display: none;">
                <button id="btn-load-texture">Aplicar Textura Img</button>
            </div>

            <div class="section-title">🦴 Rigging y Huesos</div>
            <div class="button-group">
                <button id="btn-add-bone">Agregar Hueso</button>
                <button id="btn-toggle-skeleton">Ver/Ocultar Esqueleto</button>
            </div>

            <div class="section-title">🎬 Animación (Frame x Frame)</div>
            <div class="button-group">
                <button id="btn-add-keyframe">Guardar Keyframe</button>
                <button id="btn-play-animation">Reproducir</button>
            </div>

            <button id="btn-delete" class="danger-btn">Eliminar Selección</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
